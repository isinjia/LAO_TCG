# 깃허브 페이지 배포: 게임 실행에 필요한 파일만 올린다 (tools/ 의 렌더링 도구·결과물, 문서는 제외)
# 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 두면 main에 올릴 때마다 배포된다.
name: 웹 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 규칙 테스트 (실패하면 배포하지 않는다)
        run: node tools/test.js
      - name: 배포할 파일 모으기
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js favicon.ico .nojekyll css js assets _site/
          # 오프라인 미리 받기 목록: 코드·글꼴·화면 조각·효과음·카드 그림·배경 (전신 그림·배경음·음성은 볼 때 받는다)
          (cd _site && { echo index.html; echo manifest.webmanifest; find css js assets/font assets/ui assets/sfx assets/skill assets/art assets/bg -type f; } > precache.txt)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
