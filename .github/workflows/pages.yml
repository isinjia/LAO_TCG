# 깃허브 페이지 배포: 게임 실행에 필요한 파일만 올린다 (tools/ 의 렌더링 도구·결과물, 문서는 제외)
# 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 두면 main에 올릴 때마다 배포된다.
name: 웹 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포할 파일 모으기
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js favicon.ico .nojekyll css js assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
